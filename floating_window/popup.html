<!DOCTYPE html>
<html>

<head>
    <title>Widget Control</title>
    <style>
        body {
            font-family: sans-serif;
            width: 200px;
            padding: 10px;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        input[type="checkbox"] {
            transform: scale(1.2);
        }
    </style>
</head>

<body>
    <label>
        Enable Widget
        <input type="checkbox" id="widget-toggle">
    </label>

    <script src="popup.js"></script>
</body>

</html>
