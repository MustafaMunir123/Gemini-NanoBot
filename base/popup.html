<!DOCTYPE html>
<html>

<head>
    <title>Voice Nano Bot</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: sans-serif;
            width: 250px;
            padding: 15px;
        }

        h3 {
            margin: 0 0 10px 0;
            color: #007bff;
            font-size: 16px;
        }

        .info {
            background: #f0f8ff;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 10px;
            border-left: 3px solid #007bff;
        }

        .shortcut {
            font-weight: bold;
            color: #007bff;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 13px;
            padding: 8px 0;
        }

        input[type="checkbox"] {
            transform: scale(1.2);
        }

        .note {
            font-size: 11px;
            color: #666;
            margin-top: 10px;
            font-style: italic;
        }
    </style>
</head>

<body>
    <h3>🎤 Voice Nano Bot</h3>
    
    <div class="info">
        Press <span class="shortcut">Ctrl+Q</span> to start/stop voice input. The extension auto-enables on first use!
    </div>

    <label>
        Manual Control
        <input type="checkbox" id="widget-toggle">
    </label>

    <div class="note">
        ℹ️ Checkbox is optional. Ctrl+Q always works and auto-enables the bot.
    </div>

    <script src="popup.js"></script>
</body>

</html>
