<!DOCTYPE html>
<html>

<head>
    <title>Voice To Text</title>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 380px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 0;
            color: #fff;
            
        }

        .container {
            padding: 24px;
            
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, #e0e7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
            font-weight: 300;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .status-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .status-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s ease;
        }

        .status-icon.listening {
            background: rgba(74, 222, 128, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 0 10px rgba(74, 222, 128, 0);
            }
        }

        .status-text {
            text-align: center;
        }

        .status-label {
            font-size: 12px;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        #status {
            font-size: 18px;
            font-weight: 600;
            margin-top: 4px;
        }

        .transcript-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        #result {
            width: 100%;
            min-height: 120px;
            border: none;
            background: transparent;
            color: #374151;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            font-family: inherit;
            outline: none;
        }

        #result::-webkit-scrollbar {
            width: 6px;
        }

        #result::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 3px;
        }

        #result::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }

        .shortcut-hint {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 12px 16px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .shortcut-hint p {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        .keyboard-shortcut {
            display: inline-flex;
            gap: 4px;
            margin-top: 4px;
        }

        .key {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .footer {
            text-align: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .footer p {
            font-size: 11px;
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <div class="container" style="border-radius: 20px;">
        <div class="header">
            <h1>🎙️ Voice To Text</h1>
            <p>Speak naturally, transcribe instantly</p>
        </div>

        <div class="status-card">
            <div class="status-header">
                <div class="status-icon" id="statusIcon">🎤</div>
            </div>
            <div class="status-text">
                <div class="status-label">Status</div>
                <div id="status">Ready</div>
            </div>
        </div>

        <div class="transcript-card">
            <textarea id="result" placeholder="Your transcribed text will appear here..."></textarea>
        </div>

        <div class="shortcut-hint">
            <p>Quick Toggle</p>
            <div class="keyboard-shortcut">
                <span class="key">Ctrl</span>
                <span class="key">+</span>
                <span class="key">Q</span>
            </div>
        </div>

        <div class="footer">
            <p>Press Ctrl+Q to start/stop recording</p>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
