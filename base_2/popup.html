<!DOCTYPE html>
<html>

<head>
    <title>Floating Circle Control</title>
    <style>
        body {
            font-family: sans-serif;
            width: 250px;
            padding: 10px;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            margin-bottom: 10px;
        }

        input[type="checkbox"] {
            transform: scale(1.2);
        }

        .file-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .file-section h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #333;
        }

        input[type="file"] {
            width: 100%;
            margin-bottom: 10px;
            font-size: 12px;
        }

        button {
            width: 100%;
            padding: 8px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            margin-top: 10px;
            padding: 5px;
            border-radius: 4px;
            font-size: 11px;
            text-align: center;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>

<body>
    <label>
        Enable Floating Circle
        <input type="checkbox" id="extension-toggle">
    </label>

    <div class="file-section">
        <h3>Context</h3>
        <input type="file" id="document-file" accept=".pdf,.txt,.docx" style="display: none;">
        <button id="parse-document">Add Document</button>
        <div id="status" class="status" style="display: none;"></div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
